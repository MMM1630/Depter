{% extends "base.html" %}{% load ui %}
{% block content %}
<div class="card narrow" style="margin-top:30px">
  <h1 class="h2">{% t 'reg_title' %}</h1>
  <p class="sub" style="margin-bottom:20px">{% t 'reg_hint' %}</p>
  <form method="post">{% csrf_token %}
    {% include "partials/fields.html" %}
    <button class="btn" style="width:100%">{% t 'reg_btn' %}</button>
  </form>
  <p class="sub" style="margin-top:18px;text-align:center">{% t 'have_account' %} <a href="{% url 'login' %}"><b>{% t 'nav_login' %}</b></a></p>
</div>
{% endblock %}
