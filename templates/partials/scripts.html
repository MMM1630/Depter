<script>
(function(){
  document.querySelectorAll('[data-theme-toggle]').forEach(function(b){
    b.addEventListener('click',function(){
      var cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
      document.documentElement.setAttribute('data-theme',cur);
      try{localStorage.setItem('depter-theme',cur)}catch(e){}
      window.dispatchEvent(new Event('themechange'));
    });
  });
  var fmt=function(n){return Math.round(n).toLocaleString('en-US').replace(/,/g,'\u00a0')};
  document.querySelectorAll('[data-count]').forEach(function(el){
    var end=parseFloat(el.getAttribute('data-count'));
    if(!isFinite(end)||end===0)return;
    var t0=performance.now(),dur=1000;
    (function step(t){var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmt(end*e);if(k<1)requestAnimationFrame(step)})(t0);
  });
  document.querySelectorAll('.toast').forEach(function(t,i){
    setTimeout(function(){t.classList.add('hide');setTimeout(function(){t.remove()},450)},4200+i*400);
  });
})();
</script>
