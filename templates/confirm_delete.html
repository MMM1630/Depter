{% extends "base.html" %}{% load ui %}
{% block content %}
<div class="card narrow">
  <h1 class="h2">{% t 'confirm_delete' obj=object %}</h1>
  <p class="sub">{% t 'confirm_warn' %}</p>
  <form method="post">{% csrf_token %}
    <div class="actions">
      <button class="btn btn-debt">{% t 'confirm_yes' %}</button>
      <a class="btn btn-ghost" href="javascript:history.back()">{% t 'cancel' %}</a>
    </div>
  </form>
</div>
{% endblock %}
